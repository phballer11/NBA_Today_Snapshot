<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1015">
  <meta name="description" content="Every NBA game, meaningful player rankings and grounded game notes. Today Snapshot, in your local time.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Today Snapshot">
  <title>NBA Today Snapshot</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/app.mjs"></script>
</head>
<body>
<div id="update-toast" class="update-toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
<a class="skip" href="#games">Skip to games</a>
<div class="shell">
  <header>
    <div class="brand"><span class="brand-mark" aria-hidden="true">N<span>•</span></span><span>TODAY SNAPSHOT <span class="edition">/ BASKETBALL</span></span><span id="timezone" class="timezone">Local time</span></div>
    <div class="title-row"><div><p class="eyebrow">THE DAILY SCOREBOARD</p><h1 id="title">NBA <span>Today Snapshot</span></h1></div><button id="refresh" class="refresh" aria-label="Refresh scores"><span aria-hidden="true">↻</span><span>Refresh</span></button></div>
    <div class="date-row"><div class="date-nav"><button id="prev" aria-label="Previous NBA day">‹</button><label class="date-label"><span class="sr-only">NBA game date (Eastern time)</span><input id="date" type="date" aria-label="NBA game date (Eastern time)"></label><button id="next" aria-label="Next NBA day">›</button><button id="today">Today</button></div><span id="local-date" class="muted"></span></div>
    <div class="slate-info"><p id="date-note">NBA game date is US Eastern · All tip-offs in your local time</p><span id="updated">Connecting…</span></div>
  </header>
  <main>
    <div class="toolbar"><span id="game-count" class="game-count">Loading…</span><nav id="game-nav" class="game-nav" aria-label="Jump to a game"></nav></div>
    <p id="notice" class="notice" role="status" hidden></p>
    <div id="announcement" class="sr-only" aria-live="polite"></div>
    <section id="games" class="games" aria-label="NBA games" aria-busy="true"><div class="skeleton" aria-label="Loading games"></div><div class="skeleton" aria-hidden="true"></div></section>
  </main>

</div>
<noscript><p class="notice">Enable JavaScript to load scores. <a href="https://www.espn.com/nba/scoreboard">Open ESPN</a></p></noscript>
</body>
</html>
