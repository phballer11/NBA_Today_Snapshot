name: Snapshot and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      watcher_batch:
        description: Internal watcher game batch (leave empty for manual collection)
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore last successful fallback data
        uses: actions/cache@v4
        with:
          path: data
          key: nba-snapshots-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nba-snapshots-
      - name: Fetch static JSON snapshots
        id: snapshot
        continue-on-error: true
        run: bash scripts/collect-with-retry.sh snapshot
      - name: Report feed failure
        if: steps.snapshot.outcome == 'failure'
        run: echo '::warning::ESPN snapshot collection failed. Previously saved data is retained; browser live fetching remains enabled.'
      - name: Collect game-matched YouTube links
        id: highlights
        continue-on-error: true
        run: bash scripts/collect-with-retry.sh highlights
      - name: Report highlight lookup failure
        if: steps.highlights.outcome == 'failure'
        run: echo '::warning::Highlight discovery unavailable. Previously matched links are retained; scores can still deploy.'
      - name: Record successful collection
        if: steps.snapshot.outcome == 'success' && steps.highlights.outcome == 'success'
        env:
          WATCHER_BATCH: ${{ inputs.watcher_batch }}
        run: node scripts/collection-receipt.mjs
      - name: Stage only public website files
        run: |
          mkdir -p _site
          cp index.html admin.html styles.css sw.js manifest.webmanifest _site/
          cp -R js icons data _site/
          rm -f _site/data/highlights/catalog.json _site/data/.collection-success.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
