name: Snapshot and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # More opportunities to run; GitHub may delay/drop scheduled triggers.
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'schedule' || vars.ENABLE_SNAPSHOTS == 'true' || vars.ENABLE_HIGHLIGHTS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore last successful fallback data
        uses: actions/cache@v4
        with:
          path: data
          key: nba-snapshots-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nba-snapshots-
      - name: Check collection freshness
        id: freshness
        run: node scripts/collection-policy.mjs
      - name: Fetch static JSON snapshots
        if: steps.freshness.outputs.collect == 'true'
        id: snapshot
        continue-on-error: true
        run: bash scripts/collect-with-retry.sh snapshot
      - name: Report feed failure
        if: steps.snapshot.outcome == 'failure'
        run: echo '::warning::ESPN snapshot collection failed. Previously saved data is retained; browser live fetching remains enabled.'
      - name: Collect game-matched YouTube links
        if: steps.freshness.outputs.collect == 'true'
        id: highlights
        continue-on-error: true
        run: bash scripts/collect-with-retry.sh highlights
      - name: Report highlight lookup failure
        if: steps.highlights.outcome == 'failure'
        run: echo '::warning::Highlight discovery unavailable. Previously matched links are retained; scores can still deploy.'
      - name: Stage only public website files
        if: steps.freshness.outputs.collect == 'true'
        run: |
          mkdir -p _site
          cp index.html styles.css sw.js manifest.webmanifest _site/
          cp -R js icons data _site/
          rm -f _site/data/highlights/catalog.json _site/data/.collection-success.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        if: steps.freshness.outputs.collect == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.freshness.outputs.collect == 'true'
        with:
          path: _site
      - name: Deploy GitHub Pages
        if: steps.freshness.outputs.collect == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record successful collection and deployment
        if: steps.deployment.outcome == 'success' && steps.snapshot.outcome == 'success' && steps.highlights.outcome == 'success'
        run: node scripts/collection-policy.mjs mark
